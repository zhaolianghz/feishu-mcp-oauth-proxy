# feishu-mcp — nginx 反向代理配置模板
#
# 【部署前必改】复制到 /etc/nginx/conf.d/ 后替换两处占位符：
#   cp feishu-mcp-oauth/nginx-feishu-mcp.conf /etc/nginx/conf.d/feishu-mcp.conf
#   sed -i 's/mcp\.example\.com/你的域名/g'          /etc/nginx/conf.d/feishu-mcp.conf
#   sed -i 's|YOUR_DOMAIN|你的域名|g'                /etc/nginx/conf.d/feishu-mcp.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 【要改的三项】
#   1) server_name              → 你的域名
#   2) ssl_certificate{,_key}   → 你的证书路径
#   3) proxy_pass 里的端口      → 与 .env 的 OAUTH_PROXY_PORT 一致（默认 3011）
#
# ⚠️ reload 请用 `nginx -s reload`，不要用 `systemctl reload nginx`。
#    nginx 不在 systemd 管理下时（常见于 80 端口被 Docker 占用），
#    systemctl 会报 "Unit cannot be reloaded because it is inactive"。
#
# ⚠️ 域名不要用下划线。`_` 不符合 RFC 1123 的主机名规范，
#    新版 OpenSSL 对通配符证书做 RFC 6125 匹配时会直接判定不匹配，
#    导致严格 TLS 客户端（如 ChatGPT）全部握手失败。子域请一律用连字符。
#
# 架构：
#   Internet → nginx:443 (TLS) → oauth-proxy:3011 (OAuth 2.1 + PKCE + DCR + /mcp 反代)
#                                             ↓
#                                       feishu-mcp:3000 (lark-cli 调飞书 API)

server {
    listen 443 ssl http2;
    server_name mcp.example.com;   # ← 改成你的域名

    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 全部请求代理到 oauth-proxy:3011，由它路由 OAuth + MCP
    # （包括 /.well-known/*、/register、/authorize、/token、/oauth/github/callback、/login、/mcp）
    location / {
        proxy_pass http://127.0.0.1:3011;   # 端口须与 .env 的 OAUTH_PROXY_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/feishu-mcp.access.log;
    error_log  /var/log/nginx/feishu-mcp.error.log;
}
