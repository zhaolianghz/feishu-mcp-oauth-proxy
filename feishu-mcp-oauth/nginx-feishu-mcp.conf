# feishu-mcp — 飞书 MCP 反代 + OAuth 2.1 中间件（nginx 模板）
#
# 【部署前必改】把本文件复制到 /etc/nginx/conf.d/ 并替换：
#   1) server_name            → 你的域名
#   2) ssl_certificate{,_key} → 你的证书路径
#   3) proxy_pass 里的端口    → 与 .env 的 OAUTH_PROXY_PORT 一致（默认 3011）
#
#   cp feishu-mcp-oauth/nginx-feishu-mcp.conf /etc/nginx/conf.d/
#   sed -i 's/mcp\.example\.com/你的域名/g' /etc/nginx/conf.d/feishu-mcp.conf
#   sudo nginx -t && sudo nginx -s reload
#
# ⚠️ reload 用 `nginx -s reload`，不要用 `systemctl reload nginx`
#    —— 若 nginx.service 处于 failed（常见于 80 端口被 docker 占用），
#    systemctl 会报 "Unit cannot be reloaded because it is inactive"
#
# 模式：Cloudflare Origin CA + 443 server_name 分流，HTTP→HTTPS 由边缘完成
#
# ⚠️ 历史教训：这个域名最初叫 bad_name.example.com（下划线）。
#    RFC 1123 不允许主机名含 "_"，新版 OpenSSL 按 RFC 6125 做通配符匹配时直接拒绝，
#    *.example.com 对 bad_name.example.com 的匹配 → SSLCertVerificationError。
#    实测：af / clawbox 通过，feishu_mcp 失败（同一张 CF 边缘证书）。
#    → 已改为连字符 feishu-mcp，旧域名 DNS 记录已删除。
#    以后起子域一律用连字符，永远别用下划线。
#
# 架构：
#   Internet (CF 边缘) → nginx:443 (TLS) → oauth-proxy:3011 (OAuth 2.1 + PKCE + DCR + /mcp 反代)
#                                                ↓
#                                          feishu-mcp:3000 (lark-cli 调飞书 API)

server {
    listen 443 ssl http2;
    server_name mcp.example.com;   # ← 改成你的域名

    # 通配符证书 *.example.com，与 af/clawbox 共用同一张
    # 若 symlink 丢失，重建：
    #   ln -s /etc/nginx/ssl/wildcard.example.com.pem /etc/nginx/ssl/YOUR_DOMAIN.pem
    #   ln -s /etc/nginx/ssl/wildcard.example.com.key /etc/nginx/ssl/YOUR_DOMAIN.key
    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 全部请求代理到 oauth-proxy:3011，由它路由 OAuth + MCP
    # （包括 /.well-known/*、/register、/authorize、/token、/oauth/github/callback、/login、/mcp）
    location / {
        proxy_pass http://127.0.0.1:3011;   # 端口须与 .env 的 OAUTH_PROXY_PORT 一致
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/feishu-mcp.access.log;
    error_log  /var/log/nginx/feishu-mcp.error.log;
}
